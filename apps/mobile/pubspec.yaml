name: golden_hour
description: "Golden Hour — Universal Medical Emergency QR Code System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3+1

  # Secure local storage
  flutter_secure_storage: ^9.2.2

  # QR code
  qr_flutter: ^4.1.0

  # Share & file
  share_plus: ^10.0.0
  image_gallery_saver_plus: ^3.0.4

  # WebView (preview responder page)
  webview_flutter: ^4.8.0

  # PDF export
  pdf: ^3.10.8
  printing: ^5.12.0

  # Firebase (push notifications)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.2

  # Supabase auth
  supabase_flutter: ^2.5.5

  # Lottie animations
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/fonts/
